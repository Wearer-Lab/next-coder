name: Staging release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a newer main commit or roll back to an older compatible main commit.
        required: true
        type: choice
        options:
          - deploy
          - rollback
      target_commit_sha:
        description: Exact 40-character commit SHA to build and deploy.
        required: true
        type: string
      current_commit_sha:
        description: Exact source commit currently deployed to both staging services.
        required: true
        type: string
      current_edge_version:
        description: Exact active 100% edge Worker version ID observed before authorization.
        required: true
        type: string
      current_control_plane_version:
        description: Exact active 100% private control-plane Worker version ID observed before authorization.
        required: true
        type: string
      confirmation:
        description: Enter operation:staging:TARGET_SHA exactly (for example deploy:staging:0123...).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: next-coder-staging-release
  cancel-in-progress: false

jobs:
  verify-commit:
    name: Verify pinned staging candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out protected automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit_sha }}
          fetch-depth: 0
          path: release
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: |
            release/package-lock.json
            release/cloudflare/package-lock.json
            release/cloudflare-control-plane/package-lock.json
      - name: Capture checked-out commit without credentials
        working-directory: release
        run: echo "STAGING_RELEASE_CHECKED_OUT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate branch, commit direction, migrations, bindings, and confirmation
        working-directory: release
        env:
          STAGING_RELEASE_OPERATION: ${{ inputs.operation }}
          STAGING_RELEASE_TARGET_COMMIT: ${{ inputs.target_commit_sha }}
          STAGING_RELEASE_CURRENT_COMMIT: ${{ inputs.current_commit_sha }}
          STAGING_RELEASE_CURRENT_EDGE_VERSION: ${{ inputs.current_edge_version }}
          STAGING_RELEASE_CURRENT_CONTROL_PLANE_VERSION: ${{ inputs.current_control_plane_version }}
          STAGING_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_RELEASE_CHECKED_OUT_COMMIT: ${{ env.STAGING_RELEASE_CHECKED_OUT_COMMIT }}
          STAGING_RELEASE_AUTOMATION_COMMIT: ${{ github.sha }}
          STAGING_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STAGING_RELEASE_DISPATCH_REF: ${{ github.ref_name }}
          STAGING_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release
        run: node ../automation/scripts/staging-release.mjs validate-local
      - name: Install locked root dependencies
        working-directory: release
        run: npm ci --no-audit --no-fund
      - name: Install locked Cloudflare edge dependencies
        working-directory: release
        run: npm ci --prefix cloudflare --no-audit --no-fund
      - name: Install locked private control-plane dependencies
        working-directory: release
        run: npm ci --prefix cloudflare-control-plane --no-audit --no-fund
      - name: Run repository secret gate
        working-directory: release
        run: npm run security:repo
      - name: Validate maintained documentation links
        working-directory: release
        run: npm run check:docs
      - name: Run repository gate
        working-directory: release
        run: npm test
      - name: Verify connector package artifact
        working-directory: release
        run: npm run pack:connector
      - name: Verify release Container artifact
        working-directory: release
        run: npm run test:container
      - name: Test protected release and qualification harnesses
        working-directory: automation
        run: npm run test:workflow

  release:
    name: Protected staging mutation
    needs: verify-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.NEXT_CODER_STAGING_URL || vars.AGENT_CONTROLLER_STAGING_URL }}
    steps:
      - name: Check out protected automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit_sha }}
          fetch-depth: 0
          path: release
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: |
            release/package-lock.json
            release/cloudflare/package-lock.json
            release/cloudflare-control-plane/package-lock.json
      - name: Install locked deployment dependencies
        working-directory: release
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix cloudflare --no-audit --no-fund
          npm ci --prefix cloudflare-control-plane --no-audit --no-fund
      - name: Build the console from the pinned commit
        working-directory: release
        run: npm run build:app
      - name: Capture checked-out commit without credentials
        working-directory: release
        run: echo "STAGING_RELEASE_CHECKED_OUT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Read-only account and binding preflight
        working-directory: release
        env: &staging-release-environment
          CI: "true"
          NO_COLOR: "1"
          STAGING_RELEASE_OPERATION: ${{ inputs.operation }}
          STAGING_RELEASE_TARGET_COMMIT: ${{ inputs.target_commit_sha }}
          STAGING_RELEASE_CURRENT_COMMIT: ${{ inputs.current_commit_sha }}
          STAGING_RELEASE_CURRENT_EDGE_VERSION: ${{ inputs.current_edge_version }}
          STAGING_RELEASE_CURRENT_CONTROL_PLANE_VERSION: ${{ inputs.current_control_plane_version }}
          STAGING_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_RELEASE_CHECKED_OUT_COMMIT: ${{ env.STAGING_RELEASE_CHECKED_OUT_COMMIT }}
          STAGING_RELEASE_AUTOMATION_COMMIT: ${{ github.sha }}
          STAGING_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STAGING_RELEASE_DISPATCH_REF: ${{ github.ref_name }}
          STAGING_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release
          STAGING_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/release/staging-release-evidence.json
          NEXT_CODER_STAGING_URL: ${{ vars.NEXT_CODER_STAGING_URL || vars.AGENT_CONTROLLER_STAGING_URL }}
          NEXT_CODER_STAGING_MEDIA_BUCKET: ${{ vars.NEXT_CODER_STAGING_MEDIA_BUCKET || vars.AGENT_CONTROLLER_STAGING_MEDIA_BUCKET }}
          NEXT_CODER_STAGING_FIRMWARE_BUCKET: ${{ vars.NEXT_CODER_STAGING_FIRMWARE_BUCKET || vars.AGENT_CONTROLLER_STAGING_FIRMWARE_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: node ../automation/scripts/staging-release.mjs preflight
      - name: Deploy or roll back in dependency-safe order
        working-directory: release
        env: *staging-release-environment
        run: node ../automation/scripts/staging-release.mjs execute
      - name: Upload redacted deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-release-${{ inputs.operation }}-${{ inputs.target_commit_sha }}
          path: release/staging-release-evidence.json
          if-no-files-found: warn
          retention-days: 30
