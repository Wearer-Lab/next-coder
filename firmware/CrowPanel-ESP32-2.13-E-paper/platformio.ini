; CrowPanel ESP32 2.13" E-Paper HMI Display (122x250)
; https://www.elecrow.com/wiki/CrowPanel_ESP32_E-Paper_HMI_2.13-inch_Display.html
;
; Module: ESP32-S3-WROOM-1 N8R8 (8 MB flash, 8 MB octal PSRAM).
; The board programs over a USB-to-UART bridge, not native USB: the vendor
; firmware drives GPIO19 as the power LED, and GPIO19/20 are the ESP32-S3
; native USB D-/D+ pins. Enabling USB CDC would fight the LED, so Serial stays
; on UART0.
; Roadmap Phase 4 minimum production security and Phase 12 OTA rollback.
;
; These are opt-in build settings, not defaults, because enabling them is irreversible on real
; silicon: secure boot and flash encryption burn eFuses, and a wrong key ceremony bricks the board.
; Read docs/production-security.md before using this environment on hardware you care about.
;
;   pio run -e crowpanel-esp32-213-epaper-secure
;
; The application handles PENDING_VERIFY confirmation and rollback telemetry. Actual automatic
; Full rollback before application setup requires a custom ESP-IDF bootloader built with
; CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y. The application also keeps a boot-attempt fallback for
; distributed Arduino bootloaders that mark the selected image valid immediately.
[env:crowpanel-esp32-213-epaper-secure]
extends = env:crowpanel-esp32-213-epaper
build_flags =
    ${env:crowpanel-esp32-213-epaper.build_flags}
    -DSECURE_BUILD_TLS_VERIFY=1
    -DSECURE_BUILD_ENABLE_OTA_APPLY=1
    -DSECURE_BUILD_REQUIRE_OTA_SIGNATURE=1
board_build.partitions = partitions_ota.csv

[env:crowpanel-esp32-213-epaper]
; ESP-IDF 5.5 / Arduino core 3.3, via the pioarduino platform fork. Pinned across every board so
; the tree has one toolchain. Espressif stopped maintaining the official platformio-espressif32,
; which is stuck on Arduino 2.0.17 / ESP-IDF 4.4 — no `driver/i2s_std.h`, so no modern I2S, which
; the on-board audio boards need. Verified: all four boards build on this platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/build_overrides.py

board_build.flash_mode = qio
board_build.flash_size = 8MB
; N8R8 carries octal PSRAM; qio_opi is the flash/PSRAM combination for it.
board_build.arduino.memory_type = qio_opi
; Two app slots, required by ENABLE_OTA_APPLY.
board_build.partitions = default_8MB.csv

; src/diag/ holds standalone bench probes with their own setup()/loop().
build_src_filter = +<*> -<diag/>

; No GxEPD2: this panel is a JD79661 and GxEPD2 only speaks SSD1680. The panel
; driver lives in lib/ElecrowEPD and is picked up automatically.
lib_deps =
  bblanchon/ArduinoJson@^7.0.4

; DeviceStore (NVS) and Provisioning (boot state machine + SoftAP portal), shared with the
; vision-master-t190 board so the second panel is a display adapter rather than a second firmware.
lib_extra_dirs = ../shared

; The devkitc-1 definition assumes native USB; this board does not have it.
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; The shared AgentControllerCore library is compiled in its own include context. Without the
  ; board's include directory on its search path it cannot see controller_config.h, so it builds
  ; with no TLS trust anchor and refuses every HTTPS request. Wire the board config in.
  -Iinclude

; Bench probe for the e-paper panel: reports BUSY polarity and tries a white fill.
;   pio run -e epd-probe -t upload && pio device monitor
[env:epd-probe]
extends = env:crowpanel-esp32-213-epaper
build_src_filter = -<*> +<diag/epd_probe.cpp>

; Media capture build: push-to-talk audio over I2S plus a still image over
; esp32-camera. Off in the default env because the CrowPanel 2.13" board has
; neither part and its only spare IO is the two-pin expansion header, so this
; targets a carrier board or a different ESP32-S3 module.
;
;   pio run -e crowpanel-esp32-213-epaper-capture
;
; Set the pins in include/controller_config.h first: the camera defaults are a
; Freenove ESP32-S3-WROVER map and collide with the CrowPanel keys.
;
; No lib_deps are added. esp32-camera ships inside the ESP32 Arduino core
; (tools/sdk/esp32s3/include/esp32-camera, linked as -lesp32-camera) and the I2S
; driver is part of ESP-IDF, so both are guarded by the macros alone. On an
; Arduino core that does not bundle the camera driver, add
; espressif/esp32-camera to the lib_deps below; media_capture.cpp raises an
; #error naming it if esp_camera.h cannot be found.
[env:crowpanel-esp32-213-epaper-capture]
extends = env:crowpanel-esp32-213-epaper
build_flags =
  ${env:crowpanel-esp32-213-epaper.build_flags}
  -DENABLE_AUDIO_CAPTURE=1
  -DENABLE_CAMERA_CAPTURE=1

; Hermetic compile-only proof for CI and agent work. This forces the checked-in placeholder config
; even when a maintainer has a live ignored controller_config.h beside it. Never upload this image.
[env:crowpanel-esp32-213-epaper-capture-placeholder]
extends = env:crowpanel-esp32-213-epaper-capture
build_flags =
  ${env:crowpanel-esp32-213-epaper-capture.build_flags}
  -DCONTROLLER_CONFIG_PLACEHOLDER_BUILD=1
