; Hosyond / LCDWIKI ES3C28P — 2.8" IPS ESP32-S3 touchscreen display module
; Vendor spec: docs/2.8inch_IPS_ESP32-S3_ILI9341V_ES3C28P_ES3N28P_V1.0/2-规格书_Specification/
;
; Module: ESP32-S3, 512 KB SRAM + 8 MB internal OPI PSRAM + 16 MB external SPI flash.
; Display: 2.8" IPS 240x320, ILI9341V, 4-line SPI.
; Touch:   FT6336G capacitive, I2C address 0x38.
; Audio:   on-board MEMS microphone AND speaker connector, both through one ES8311 mono codec.
; Storage: microSD over SDIO (4-bit).
; Power:   3.7 V lithium connector with on-board charging; battery sense on GPIO9 (ADC1_CH8).
;
; Unlike the Waveshare AMOLED board, every pin here is taken from the manufacturer's own
; specification (section 4.2, "ESP32-S3 pin allocation") and cross-checked against the vendor
; Arduino examples that ship in docs/. Nothing in the pin map is guesswork.
;
; STATUS: compiles; never flashed. No board has been in hand.

[env:hosyond-es3c28p]
; ESP-IDF 5.5 / Arduino core 3.3, via the pioarduino platform fork. Pinned across every board so
; the tree has one toolchain. Espressif stopped maintaining the official platformio-espressif32,
; which is stuck on Arduino 2.0.17 / ESP-IDF 4.4 — no `driver/i2s_std.h`, so no modern I2S, which
; this board's vendored ES8311 driver and I2S capture path both require.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/build_overrides.py

board_build.flash_mode = qio
board_build.flash_size = 16MB
; "8M internal OPI PSRAM" per the vendor spec, so qio flash + opi PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv

; This board has no USB-to-UART bridge — the Type-C port is the ESP32-S3's native USB, so Serial
; is USB CDC. See docs/.../README(Important).txt. This is the same arrangement as the Waveshare
; AMOLED board and the opposite of the CrowPanel.
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ; The shared AgentControllerCore library is compiled in its own include context. Without the
  ; board's include directory on its search path it cannot see controller_config.h, so it builds
  ; with no TLS trust anchor and refuses every HTTPS request. Wire the board config in.
  -Iinclude

lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ILI9341@^1.6.1

; DeviceStore (NVS) and Provisioning (SoftAP portal), shared with every other board.
; The ES8311 codec driver is vendored in lib/ and needs no external fetch.
lib_extra_dirs = ../shared

; Audio capture. Unlike the CrowPanel — where this environment needs a carrier board that does not
; exist — the microphone and speaker are on this board, so this is the environment that matters.
; The speaker and the notification LED both live here. ENABLE_SPEAKER requires
; ENABLE_AUDIO_CAPTURE — the I2S channels and the ES8311 are brought up by src/audio.cpp and the
; DAC borrows them — and speaker.cpp #errors rather than half-building if the two disagree.
[env:hosyond-es3c28p-capture]
extends = env:hosyond-es3c28p
build_flags =
  ${env:hosyond-es3c28p.build_flags}
  -DENABLE_AUDIO_CAPTURE=1
  -DENABLE_SPEAKER=1
  -DENABLE_NOTIFICATION_LED=1

; Recovery image: no display, no audio. Flash this if a display change bricks the boot and the
; board has to be brought back with a manual download-mode entry. Keeping it as a named env means
; the recovery path is one command rather than an edit under pressure.
[env:hosyond-es3c28p-recovery]
extends = env:hosyond-es3c28p
build_flags =
  ${env:hosyond-es3c28p.build_flags}
  -DENABLE_LCD=0
  -DENABLE_AUDIO_CAPTURE=0
  -DENABLE_SPEAKER=0
  -DENABLE_NOTIFICATION_LED=0
  -DAUDIO_BOOT_SELFTEST_MS=0

; Display bring-up. Separate because ENABLE_LCD defaults to 0 after the adapter's first hardware
; flash left the board unbootable — see include/controller_config.example.h. Bisect here, and only
; fold the display into the default envs once it survives a reset cycle.
; The LED is on here but the speaker is not: the LED needs no codec, so a display bisect can still
; have its status light, while anything touching I2S stays out of a build whose whole purpose is to
; have no audio in it.
[env:hosyond-es3c28p-display]
extends = env:hosyond-es3c28p
build_flags =
  ${env:hosyond-es3c28p.build_flags}
  -DENABLE_LCD=1
  -DENABLE_NOTIFICATION_LED=1

; Cycles every orb mode on a timer and reports per-mode frame cost, so the expensive ones are
; measurable without needing a finger on the glass.
[env:hosyond-es3c28p-orbbench]
extends = env:hosyond-es3c28p-display
build_flags =
  ${env:hosyond-es3c28p-display.build_flags}
  -DORB_BENCH=1

; Display AND microphone: the only environment that is the actual product.
;
; The two envs above each disable half of it — -display has no codec, -capture has no panel — which
; was fine while both were bring-up harnesses and is not fine now that the screen is the interface
; and the microphone is how a request is made. Kept separate from them rather than replacing them,
; because bisecting a display fault still wants a build with no audio in it and vice versa.
[env:hosyond-es3c28p-controller]
extends = env:hosyond-es3c28p
build_flags =
  ${env:hosyond-es3c28p.build_flags}
  -DENABLE_LCD=1
  -DENABLE_AUDIO_CAPTURE=1
  -DENABLE_SPEAKER=1
  -DENABLE_NOTIFICATION_LED=1
  -DSECURE_BUILD_TLS_VERIFY=1
  -DSECURE_BUILD_ENABLE_OTA_APPLY=1
  -DSECURE_BUILD_REQUIRE_OTA_SIGNATURE=1
  -DENABLE_OTA_APPLY=1
  -DREQUIRE_OTA_SIGNATURE=1

# Bench only. Drives the real recording path from the loop so the board can measure whether the orb
# running inside the audio pump costs samples. Never a product build.
[env:hosyond-es3c28p-bench]
extends = env:hosyond-es3c28p-controller
build_flags =
  ${env:hosyond-es3c28p-controller.build_flags}
  -DBENCH_SELFTEST=1
