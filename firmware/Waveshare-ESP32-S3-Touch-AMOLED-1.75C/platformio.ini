; Waveshare ESP32-S3-Touch-AMOLED-1.75C
; https://docs.waveshare.com/ESP32-S3-Touch-AMOLED-1.75C
;
; Module: ESP32-S3R8 (dual-core LX7 @ 240 MHz, 512 KB SRAM, 8 MB octal PSRAM, 16 MB flash).
; Display: 1.75" round AMOLED 466x466, CO5300 controller over QSPI.
; Touch:   CST9217 capacitive, I2C, two-point.
; Audio:   dual-microphone array -> ES7210 ADC (I2S/TDM in), ES8311 codec -> speaker pads.
; Power:   AXP2101 PMIC with a 3.7 V MX1.25 battery header.
; Motion:  QMI8658 6-axis IMU. Plus an on-board RTC.
;
; Why this board is in the tree: it is the first Next Coder target with a microphone the
; product can actually use. See README.md for the evaluation and the port plan.
;
; STATUS: safe claim/health scaffold. The shared gateway client runs with display, thread-picker,
; microphone and camera capabilities all false; neither environment touches a peripheral pin.
; Nothing has been flashed — no board has been in hand. A clean build proves only toolchain/source
; consistency, never qio_opi, flash size, native USB, partition layout, or the transcribed pin map.

[env:waveshare-amoled-175c]
; ESP-IDF 5.5 / Arduino core 3.3, via the pioarduino platform fork. Pinned across every board so
; the tree has one toolchain. Espressif stopped maintaining the official platformio-espressif32,
; which is stuck on Arduino 2.0.17 / ESP-IDF 4.4 — no `driver/i2s_std.h`, so no modern I2S, which
; the on-board audio boards need. Verified: all four boards build on this platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.flash_size = 16MB
; ESP32-S3R8 carries octal PSRAM; qio_opi is the flash/PSRAM combination for it.
board_build.arduino.memory_type = qio_opi
; Two app slots. Required before ENABLE_OTA_APPLY can be turned on.
board_build.partitions = partitions_ota.csv

; Unlike the CrowPanel, this board programs over the ESP32-S3's native USB, so USB CDC stays on
; and Serial is the USB port rather than UART0.
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ; The shared AgentControllerCore library is compiled in its own include context. Without the
  ; board's include directory on its search path it cannot see controller_config.h, so it builds
  ; with no TLS trust anchor and refuses every HTTPS request. Wire the board config in.
  -Iinclude

lib_deps =
  bblanchon/ArduinoJson@^7.0.4

; DeviceStore (NVS) and Provisioning (boot state machine + SoftAP portal), shared with the
; CrowPanel and vision-master boards.
lib_extra_dirs = ../shared

; Audio compile probe. ENABLE_AUDIO_CAPTURE names the intended future driver path, but the current
; scaffold has no ES7210 driver, touches no audio pins, and explicitly advertises no microphone.
; It cannot become a release target until silicon capture evidence exists.
[env:waveshare-amoled-175c-capture]
extends = env:waveshare-amoled-175c
build_flags =
  ${env:waveshare-amoled-175c.build_flags}
  -DENABLE_AUDIO_CAPTURE=1
