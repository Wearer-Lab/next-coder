; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:vision-master-t190]
; ESP-IDF 5.5 / Arduino core 3.3, via the pioarduino platform fork. Pinned across every board so
; the tree has one toolchain. Espressif stopped maintaining the official platformio-espressif32,
; which is stuck on Arduino 2.0.17 / ESP-IDF 4.4 — no `driver/i2s_std.h`, so no modern I2S, which
; the on-board audio boards need. Verified: all four boards build on this platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
lib_deps = 
	bblanchon/ArduinoJson@^7.0.4
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
lib_extra_dirs = ../shared
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	; The shared AgentControllerCore library is compiled in its own include context. Without
	; the board's include directory on its search path it cannot see controller_config.h, so it
	; builds with no TLS trust anchor and refuses every HTTPS request. Wire the board config in.
	-Iinclude
	-DSECURE_BUILD_TLS_VERIFY=1
